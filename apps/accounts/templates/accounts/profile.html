{% extends 'base.html' %}

{% block title %}المكتبة الرقمية - حسابي{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-4">أهلاً بك، {{ user.username }}</h2>
                <p class="card-text">هذا هو ملفك الشخصي.</p>
                <hr>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">تسجيل الخروج</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
