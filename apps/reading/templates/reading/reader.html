{% extends 'base.html' %}
{% block title %}المكتبة الرقمية - قراءة: {{ book.title }}{% endblock %}

{% block content %}
<div class="container-fluid mt-3">
    <div class="row mb-3 align-items-center">
        <div class="col">
            <h4 class="mb-0">{{ book.title }}</h4>
            <small class="text-muted">{{ book.author.name }}</small>
        </div>
        <div class="col-auto">
            <a href="{% url 'catalog:book_detail' book.pk %}" class="btn btn-outline-secondary btn-sm">
                &larr; العودة إلى الكتاب
            </a>
        </div>
    </div>

    <!-- PDF.js Reader Controls -->
    <div class="card shadow-sm mb-3">
        <div class="card-body d-flex align-items-center gap-3 flex-wrap">
            <button id="btn-prev" class="btn btn-primary" disabled>&#8594; السابق</button>
            <button id="btn-next" class="btn btn-primary" disabled>التالي &#8592;</button>
            <span id="page-info" class="ms-2 text-muted">جارٍ التحميل...</span>
            <div class="ms-auto d-flex gap-2">
                <button id="btn-zoom-out" class="btn btn-outline-secondary btn-sm">تصغير −</button>
                <button id="btn-zoom-in" class="btn btn-outline-secondary btn-sm">تكبير +</button>
            </div>
        </div>
    </div>

    <!-- PDF Canvas -->
    <div class="text-center" style="overflow-x: auto;">
        <canvas id="pdf-canvas" style="border: 1px solid #dee2e6; max-width: 100%; background: #fff;"></canvas>
        <p id="pdf-error" class="text-danger mt-3 d-none">حدث خطأ أثناء تحميل الكتاب. يرجى المحاولة مرة أخرى.</p>
        <p id="pdf-loading" class="text-muted mt-3">جارٍ تحميل الكتاب...</p>
    </div>
</div>

<!-- PDF.js via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
    'use strict';

    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // The ONLY URL used to load the PDF — a protected Django endpoint, never a media URL
    const PDF_URL = '{{ protected_pdf_url }}';

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const loadingEl = document.getElementById('pdf-loading');
    const errorEl = document.getElementById('pdf-error');
    const pageInfoEl = document.getElementById('page-info');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1.4;
    let rendering = false;

    function renderPage(num) {
        if (rendering) return;
        rendering = true;
        pdfDoc.getPage(num).then(function (page) {
            const viewport = page.getViewport({ scale: scale });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const renderCtx = { canvasContext: ctx, viewport: viewport };
            page.render(renderCtx).promise.then(function () {
                rendering = false;
                pageInfoEl.textContent = 'الصفحة ' + num + ' من ' + pdfDoc.numPages;
                btnPrev.disabled = num <= 1;
                btnNext.disabled = num >= pdfDoc.numPages;
                loadingEl.classList.add('d-none');
            });
        });
    }

    pdfjsLib.getDocument(PDF_URL).promise.then(function (pdf) {
        pdfDoc = pdf;
        renderPage(currentPage);
        btnPrev.disabled = false;
        btnNext.disabled = false;
    }).catch(function () {
        loadingEl.classList.add('d-none');
        errorEl.classList.remove('d-none');
    });

    btnPrev.addEventListener('click', function () {
        if (currentPage > 1) { currentPage--; renderPage(currentPage); }
    });
    btnNext.addEventListener('click', function () {
        if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); }
    });
    btnZoomIn.addEventListener('click', function () {
        scale = Math.min(scale + 0.2, 3.0); renderPage(currentPage);
    });
    btnZoomOut.addEventListener('click', function () {
        scale = Math.max(scale - 0.2, 0.5); renderPage(currentPage);
    });
}());
</script>
{% endblock %}
